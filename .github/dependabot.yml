version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vue-tsc doesn't work with TypeScript 7 (the Go port).
      - dependency-name: typescript
        versions: [">=7"]
      # Vitest 5 needs Node 22, local dev is on Node 20.
      - dependency-name: vitest
        versions: [">=5"]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Node majors are bumped by hand, to the next LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]
