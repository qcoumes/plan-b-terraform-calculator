<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Plan B: Terraform Calculator</title>
  <link id="favicon" rel="icon" href="data:,">
  <!-- Same rule as store.ts, applied before anything renders. -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = JSON.parse(localStorage.getItem("planb.theme"));
      } catch (e) {
        // Storage blocked: fall back to the system setting.
      }
      var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : system;
    })();
  </script>
  <!--
    Loading screen: inline because no stylesheet has loaded yet. Keep the colours
    in sync with app.css. The delayed fade-in hides it on fast loads.
  -->
  <style>
    html { background: #eef1ec; color: #667062; }
    html[data-theme="dark"] { background: #111411; color: #949c91; }
    body { margin: 0; }
    .boot {
      --accent: #2f7d5b;
      --track: #d6dbd0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      opacity: 0;
      animation: boot-in 0.3s ease 0.15s forwards;
    }
    html[data-theme="dark"] .boot { --accent: #5cc493; --track: #313831; }
    .boot img {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 2px 4px rgb(0 0 0 / 0.25));
    }
    .boot-bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--track);
    }
    .boot-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-in { to { opacity: 1; } }
    @keyframes boot-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot { animation: none; opacity: 1; }
      .boot-bar::after { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot" role="status" aria-label="Loading">
      <img src="/src/assets/icons/spaceliftGroundbase.png" alt="">
      <div class="boot-bar"></div>
    </div>
  </div>
  <noscript>
    <p style="padding: 2rem; font: 14px system-ui, sans-serif;">Plan B: Terraform Calculator needs JavaScript.</p>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
